name: Release

# Go modules are published by tagging: push v<version> and the module proxy
# serves it. This workflow gates the tag on a green build and warms the proxy
# so pkg.go.dev indexes the new version straight away.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - run: go vet ./...
      - run: go test -race ./...

      - name: Verify the tag matches the SDK version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(go run ./internal/version)
          [ "$VERSION" = "$TAG" ] || { echo "::error::client.go says $VERSION but the tag is $TAG"; exit 1; }

      - name: Ask the module proxy to fetch the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          curl -fsS "https://proxy.golang.org/github.com/fopost/fopost-go/@v/${GITHUB_REF_NAME}.info" \
            || echo "::warning::the proxy has not picked the tag up yet; it will within a few minutes"
